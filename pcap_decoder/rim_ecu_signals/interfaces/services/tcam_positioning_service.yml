name: TcamPositioningService
type: service
platform: tcam
api_version_major: 0
api_version_minor: 3
service_provider: TCAM
service_consumers: DHU, HPA

event_groups:
  - name: PositioningService  # Only use if all events are required, otherwise events that are not needed are still sent.
    id: 1
    events:
      - name: LocationEvent  # Dead reckoned location
        id: 1
      - name: RawLocationEvent  # Raw location, only sent when there is a gnss fix (open sky)
        id: 2
      - name: DataEvent
        id: 3
      - name: SvStatusEvent
        id: 4
  - name: DrLocation
    id: 2
    events:
      - name: LocationEvent  # Dead reckoned location
        id: 1
  - name: RawLocation
    id: 3
    events:
      - name: RawLocationEvent  # Raw location, only sent when there is a gnss fix
        id: 2
  - name: GnssData
    id: 4
    events:
      - name: DataEvent
        id: 3
  - name: SvStatus
    id: 5
    events:
      - name: SvStatusEvent
        id: 4

payload_proto: tcam_positioning_service
parent_proto_messages:
  - gnss_Location
  - gnss_Data
  - gnss_SvStatus
