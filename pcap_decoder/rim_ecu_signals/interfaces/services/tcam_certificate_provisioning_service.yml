name: CertificateProvisioningService
type: service
platform: tcam
api_version_major: 0
api_version_minor: 0
service_provider: TCAM
service_consumers: TCAM, HPA, DHU

methods:
  - name: SendCSR
    id: 1
  - name: SendCertificateInstalled
    id: 2
  - name: SendCertificateInstallationFailed
    id: 3

payload_proto: certificate_provisioning_service
parent_proto_messages:
  - CertificateRequest
  - CertificateResponse
  - CertificateStatusResponse
  - CertificateInstalled
  - CertificateInstallationFailed
  - Timestamp
