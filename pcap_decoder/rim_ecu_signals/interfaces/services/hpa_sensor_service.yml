name: HpaSensorService
type: service
platform: csp
api_version_major: 0
api_version_minor: 0
service_provider: HPA
service_consumers: TCAM

event_groups:
  - name: MotionSensorEventGroup
    id: 100
    events:
      - name: GyroscopeEvent
        id: 101
      - name: AccelerometerEvent
        id: 102

payload_proto: hpa_sensor_service
parent_proto_messages:
  - hpa_sensors_Gyroscope
  - hpa_sensors_Accelerometer
