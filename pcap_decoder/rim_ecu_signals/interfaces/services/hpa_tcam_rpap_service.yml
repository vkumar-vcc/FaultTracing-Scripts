name: TcamRpapService
type: service
platform: csp
api_version_major: 0
api_version_minor: 0
service_provider: HPA
service_consumers: TCAM

methods:
  - name: RpapDeviceMessage
    id: 4096

event_groups:
  - name: RpapControlEventGroup
    id: 256
    events:
      - name: RpapControlEvent
        id: 257

payload_proto: tcam_rpap_control      # Name of proto file supplied for rpap control
parent_proto_messages:                # Parent messages defined in proto file for rpap control
  - RpapPassthroughMessage
